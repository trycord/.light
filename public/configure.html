<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build your own plan — .light</title><meta name="description" content="Configure a custom hosting plan.">
<link rel="icon" href="/assets/logos/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/site.css"><link rel="stylesheet" href="/styles/marketing.css">
<script type="module" src="/js/theme.js"></script><script src="/js/brand-sync.js"></script>
</head><body><div id="site"><div style="padding:90px 22px;text-align:center;color:var(--lt-text-muted)">Loading configurator…</div></div>
<script type="module">
import api from '/js/api.js';
import { page, esc } from '/js/marketing-shell.js';
let cfg={};try{cfg=(await api.pricing()).config||{};}catch{}
if(cfg.customPlansEnabled===false){
  await page({title:'Build your own plan',active:'configure',eyebrow:'Plans',heading:'Custom plans are not enabled.',
    lede:'Resources are granted by the published plans on this platform.',
    content:'<div style="text-align:center"><a class="lt-btn lt-btn-primary" href="/pricing">View plans</a></div>'});
}else{
  await page({title:'Build your own plan',active:'configure',eyebrow:'Plans',
    heading:'Build your own plan.',
    lede:'Choose supported resources within operator-defined limits. Pricing is calculated server-side and validated before checkout.',
    content:`<div class="lt-grid lt-grid-2" style="align-items:start">
      <div class="mkt-card"><h3>Resources</h3>
        ${slider('cpuCores','CPU cores',2,cfg.minCpu||1,cfg.maxCpu||32,cfg.stepCpu||1)}
        ${slider('memoryMb','Memory (MB)',1024,cfg.minMemoryMb||256,cfg.maxMemoryMb||65536,cfg.stepMemoryMb||256)}
        ${slider('diskGb','Storage (GB)',20,cfg.minDiskGb||4,cfg.maxDiskGb||2000,cfg.stepDiskGb||4)}
        ${slider('networkGb','Network (GB)',10,0,2000,10)}
        ${slider('instances','Services',2,1,100,1)}
        <div class="lt-field" style="margin-top:16px"><label>Billing interval</label>
          <div class="lt-auth-tabs" role="group" aria-label="Billing interval"><button class="lt-auth-tab active" data-iv="monthly">Monthly</button><button class="lt-auth-tab" data-iv="yearly">Yearly</button></div></div>
      </div>
      <div class="mkt-card" style="position:sticky;top:90px"><h3>Your configuration</h3>
        <div id="summary" style="margin:16px 0"></div>
        <div style="border-top:1px solid var(--lt-border);padding-top:14px">
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">—</span></div>
          <div class="summary-row"><span>Discount</span><span id="discount">—</span></div>
          <div class="summary-row"><span>Tax</span><span id="tax">—</span></div>
          <div class="summary-row total"><span>Total</span><span id="total">—</span></div>
          <div class="lt-meta" id="periodNote" style="margin-top:4px">per month</div>
          <button class="lt-btn lt-btn-primary" id="activate" style="width:100%;margin-top:18px">Continue to checkout</button>
        </div></div></div>`});

  const state={cpuCores:2,memoryMb:1024,diskGb:20,networkGb:10,instances:2,interval:'monthly',currency:'USD'};
  const fmt=(c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:state.currency}).format(Number(c||0)/100);
  async function refresh(){
    document.getElementById('summary').innerHTML=[['CPU',state.cpuCores+' cores'],['Memory',state.memoryMb+' MB'],['Storage',state.diskGb+' GB'],['Network',state.networkGb+' GB'],['Services',state.instances]]
      .map(([l,x])=>`<div class="summary-row"><span class="lt-meta">${l}</span><b>${x}</b></div>`).join('');
    try{const r=await api.estimate({cpuCores:state.cpuCores,memoryMb:state.memoryMb,diskGb:state.diskGb,networkGb:state.networkGb,instances:state.instances},state.interval);
      const e=r.estimate;state.currency=e.currency;
      document.getElementById('subtotal').textContent=fmt(e.subtotal);document.getElementById('discount').textContent=e.discountAmount?'-'+fmt(e.discountAmount):'—';
      document.getElementById('tax').textContent=fmt(e.taxAmount);document.getElementById('total').textContent=fmt(e.total);
      document.getElementById('periodNote').textContent='per '+(state.interval==='yearly'?'year':'month');
    }catch(e){document.getElementById('total').textContent='Unavailable';}
  }
  document.querySelectorAll('[data-res]').forEach(el=>el.addEventListener('input',()=>{
    state[el.dataset.res]=Number(el.value);document.getElementById('label-'+el.dataset.res).textContent=el.value;refresh();}));
  document.querySelectorAll('[data-iv]').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('[data-iv]').forEach(x=>x.classList.remove('active'));el.classList.add('active');state.interval=el.dataset.iv;refresh();}));
  document.getElementById('activate').addEventListener('click',async()=>{
    try{
      const key=sessionStorage.getItem('lt_byop_key')||crypto.randomUUID();sessionStorage.setItem('lt_byop_key',key);
      const r=await api.createOrder({idempotencyKey:key,interval:state.interval,
        custom:{cpuCores:state.cpuCores,memoryMb:state.memoryMb,diskGb:state.diskGb,networkGb:state.networkGb,instances:state.instances},
        environmentId:'node',serviceName:'My custom service'});
      sessionStorage.removeItem('lt_byop_key');
      location.href=r.checkoutUrl||('/checkout?order='+r.order.id);
    }catch(e){alert(e.message);}
  });
  refresh();
}
function slider(key,label,value,min,max,step){return `<div class="lt-field"><label for="r-${key}">${label}: <b id="label-${key}">${value}</b></label>
  <input id="r-${key}" type="range" data-res="${key}" min="${min}" max="${max}" step="${step}" value="${value}" style="width:100%;accent-color:var(--lt-ember-500)"></div>`;}
</script></body></html>
