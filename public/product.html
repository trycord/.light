<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosting Products — .light</title>
<link rel="icon" href="/assets/logos/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/components.css"><link rel="stylesheet" href="/styles/site.css">
</head><body><div id="site"></div>
<script type="module">
import { layout, loadBranding, PRODUCTS } from '/js/site.js';
async function boot(){
  const b = await loadBranding();
  const q = new URLSearchParams(location.search).get('id');
  const p = PRODUCTS.find(x => x.id === q) || PRODUCTS[0];
  const content = `<section class="site-section"><div class="site-wrap">
    <a href="/site.html#products" class="site-muted" style="text-decoration:none">← All products</a>
    <div style="display:flex;gap:20px;align-items:center;margin:26px 0">
      <div class="site-card-icon" style="background:${p.color}1a;color:${p.color};width:56px;height:56px;font-size:26px">${p.icon}</div>
      <h1 style="font-size:2.4rem;font-weight:800;letter-spacing:-.03em;margin:0">${p.title}</h1>
    </div>
    <p style="font-size:1.1rem;color:var(--lt-text-secondary);max-width:720px">${p.desc}</p>
    <div class="site-grid" style="margin-top:36px">
      <div class="site-card"><h3>Configuration</h3><p>Configure resources, ports, environment variables and startup parameters through a guided dashboard — no manual infrastructure work.</p></div>
      <div class="site-card"><h3>Deployment</h3><p>Deploy from official templates or custom Docker images. Update, reinstall and roll back with clear status at every step.</p></div>
      <div class="site-card"><h3>Management</h3><p>Live console, file manager, logs, backups, domains and monitoring are built in for every service.</p></div>
    </div>
    <div class="site-cta-band"><a href="/index.html#register" class="lt-btn lt-btn-primary">Create Your First Server</a></div>
  </div></section>`;
  document.getElementById('site').innerHTML = layout(b, content, 'products');
}
boot();
</script></body></html>
