<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosting product — .light</title><meta name="description" content="Product plans and pricing.">
<link rel="icon" href="/assets/logos/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/site.css"><link rel="stylesheet" href="/styles/marketing.css">
<link rel="stylesheet" href="/styles/premium.css">
<script type="module" src="/js/theme.js"></script><script src="/js/brand-sync.js"></script>
</head><body><div id="site"><div style="padding:90px 22px;text-align:center;color:var(--lt-text-muted)">Loading product…</div></div>
<script type="module">
import api from '/js/api.js';
import { page, esc, errorBox } from '/js/marketing-shell.js';
const q=new URLSearchParams(location.search);
const parts=location.pathname.split('/').filter(Boolean);
const slug=q.get('id')||(parts[0]==='product'?(parts[1]||''):'');
const interval=q.get('interval')==='yearly'?'yearly':'monthly';
let data={product:{name:'Product',shortDescription:'',description:'',icon:'◈',features:[]},plans:[],locations:[]};
try{data=await api.product(slug,interval);}catch{}
const p=data.product||{},plans=data.plans||[],locs=(data.locations||[]).filter(l=>l.available);
const content=`<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px">
  <a href="/hosting" class="muted" style="text-decoration:none">← All products</a>
  <div class="lt-auth-tabs" style="margin:0;width:auto" role="group" aria-label="Billing interval">
    <a class="lt-auth-tab ${interval==='monthly'?'active':''}" href="/product?id=${encodeURIComponent(slug)}&interval=monthly">Monthly</a>
    <a class="lt-auth-tab ${interval==='yearly'?'active':''}" href="/product?id=${encodeURIComponent(slug)}&interval=yearly">Yearly</a></div></div>
<div class="mkt-split" style="margin-bottom:36px">
  <div><div class="ico" style="width:56px;height:56px;border-radius:16px;background:var(--lt-ember-alpha-12);color:var(--lt-ember-500);display:grid;place-items:center;font-size:28px">${esc(p.icon||'◈')}</div>
    <p style="color:var(--lt-text-secondary);line-height:1.7;margin:18px 0 0">${esc(p.description||p.shortDescription||'')}</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px">${(p.features||[]).map(f=>`<span class="lt-badge lt-badge-neutral">✓ ${esc(f)}</span>`).join('')}</div></div>
  <div class="mkt-visual" style="min-height:220px"><div class="mkt-visual-head"><span>Included with every plan</span><span>◆</span></div>
    ${['Dedicated Debian container','Exact runtime version','Isolated network + storage','Console, files & logs'].map((s,i)=>`<div class="mkt-node" style="margin-left:${i*8}px"><span class="dot"></span><div><b>${s}</b></div></div>`).join('')}</div>
</div>
${locs.length?`<div style="margin-bottom:34px"><h2 class="lt-h3">Available locations</h2><div class="mkt-grid" style="margin-top:12px">${locs.map(l=>`<div class="mkt-card"><h3>${esc(l.city||l.region||l.country||'Location')}</h3><p>${esc(l.country||'')}${l.latency_ms?' · '+l.latency_ms+'ms':''}</p></div>`).join('')}</div></div>`:''}
<h2 class="lt-h3" style="margin-bottom:14px">Choose a plan</h2>
<div class="mkt-grid">${plans.length?plans.map(pl=>`<div class="mkt-card" style="${pl.featured?'border-color:var(--lt-border-ember)':''}">
  ${pl.featured?'<span class="lt-badge lt-badge-ember">Featured</span>':''}
  <h3 style="margin-top:10px">${esc(pl.name)}</h3>
  <div class="price" style="font-size:26px;font-weight:800;color:var(--lt-ember-500);margin:8px 0">${pl.price?'$'+(pl.price/100).toFixed(2):'Free'}<small style="font-size:12px;color:var(--lt-text-muted)">/${interval==='yearly'?'yr':'mo'}</small></div>
  <p>${esc(pl.description||'')}</p>
  <ul style="font-size:13px;color:var(--lt-text-secondary);line-height:1.9;padding-left:18px"><li>${pl.memoryMb} MB RAM</li><li>${pl.cpuCores} vCPU</li><li>${pl.diskGb} GB storage</li><li>${pl.instances} services</li>${(pl.features||[]).map(f=>`<li>✓ ${esc(f)}</li>`).join('')}</ul>
  <a class="lt-btn ${pl.featured?'lt-btn-primary':'lt-btn-secondary'}" href="/checkout?product=${encodeURIComponent(slug)}&plan=${encodeURIComponent(pl.id)}&interval=${interval}">Get ${esc(pl.name)}</a>
</div>`).join(''):errorBox('No plans are available for this product yet.')}</div>
<p style="margin-top:20px"><a class="lt-btn lt-btn-secondary" href="/configure?product=${encodeURIComponent(slug)}">Build your own plan</a></p>`;
await page({ title:p.name||'Hosting', active:'hosting', eyebrow:'Product',
  heading:esc(p.name||'Hosting'), lede:esc(p.shortDescription||''), content });
</script></body></html>
