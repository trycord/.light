<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosting — .light</title><meta name="description" content="Browse .light hosting products for game servers, applications, websites and databases.">
<link rel="icon" href="/assets/logos/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/polish.css"><link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/site.css"><link rel="stylesheet" href="/styles/marketing.css">
<script type="module" src="/js/theme.js"></script><script src="/js/brand-sync.js"></script>
</head><body><div id="site"><div style="padding:90px 22px;text-align:center;color:var(--lt-text-muted)">Loading catalogue…</div></div>
<script type="module">
import api from '/js/api.js';
import { page, esc, emptyBox } from '/js/marketing-shell.js';
let categories=[],products=[];
try{[categories,products]=await Promise.all([api.categories(),api.products()]);}catch{}
const cat=new URLSearchParams(location.search).get('category')||'all';
const shown=cat==='all'?products.products||[]:(products.products||[]).filter(p=>p.categoryId===cat);
const content=`<div class="lt-toolbar" style="margin-bottom:22px" role="group" aria-label="Filter by category">
  ${[['all','All products'],...(categories.categories||[]).map(c=>[c.id,c.name])].map(([id,label])=>`<a class="lt-btn lt-btn-sm ${id===cat?'lt-btn-primary':'lt-btn-secondary'}" href="/hosting${id==='all'?'':'?category='+encodeURIComponent(id)}">${esc(label)}</a>`).join('')}
</div>
<div class="mkt-grid">${shown.length?shown.map(p=>`<a class="mkt-card" style="text-decoration:none;color:inherit" href="/product?id=${esc(p.slug)}">
  <div class="ico">${esc(p.icon||'◈')}</div><h3>${esc(p.name)}</h3><p>${esc(p.shortDescription||'')}</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0">${(p.features||[]).slice(0,3).map(f=>`<span class="lt-badge lt-badge-neutral">${esc(f)}</span>`).join('')}</div>
  <span>View plans →</span></a>`).join(''):emptyBox('No products in this category','Check back soon or browse all products.','<a class="lt-btn lt-btn-primary" href="/hosting">All products</a>')}</div>`;
await page({ title:'Hosting marketplace', active:'hosting', eyebrow:'Hosting marketplace',
  heading:'Hosting for every workload.',
  lede:'Real products, predefined plans and automatic provisioning. Choose what you want to host — .light handles the infrastructure.',
  content });
</script></body></html>
