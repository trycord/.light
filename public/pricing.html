<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans & pricing — .light</title><meta name="description" content="Compare .light hosting plans and pricing.">
<link rel="icon" href="/assets/logos/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/site.css"><link rel="stylesheet" href="/styles/marketing.css">
<script type="module" src="/js/theme.js"></script><script src="/js/brand-sync.js"></script>
</head><body><div id="site"><div style="padding:90px 22px;text-align:center;color:var(--lt-text-muted)">Loading plans…</div></div>
<script type="module">
import api from '/js/api.js';
import { page, esc, emptyBox } from '/js/marketing-shell.js';
const interval=new URLSearchParams(location.search).get('interval')==='yearly'?'yearly':'monthly';
let plans=[];try{plans=(await api.plans(interval)).plans||[];}catch{}
const content=`<div style="display:flex;justify-content:flex-end;margin-bottom:20px">
  <div class="lt-auth-tabs" style="margin:0;width:auto" role="group" aria-label="Billing interval">
    <a class="lt-auth-tab ${interval==='monthly'?'active':''}" href="/pricing?interval=monthly">Monthly</a>
    <a class="lt-auth-tab ${interval==='yearly'?'active':''}" href="/pricing?interval=yearly">Yearly</a></div></div>
<div class="mkt-grid">${plans.length?plans.map(p=>`<div class="mkt-card" style="${p.featured?'border-color:var(--lt-border-ember)':''}">
  ${p.featured?'<span class="lt-badge lt-badge-ember">Featured</span>':''}
  <h3 style="margin-top:10px">${esc(p.name)}</h3><p>${esc(p.description||'')}</p>
  <div class="price">${p.price?'$'+(p.price/100).toFixed(2):'Free'}<small style="font-size:12px;color:var(--lt-text-muted)">/${interval==='yearly'?'yr':'mo'}</small></div>
  <ul style="font-size:13px;color:var(--lt-text-secondary);line-height:1.9;padding-left:18px">
    <li>${p.memoryMb} MB RAM</li><li>${p.cpuCores} vCPU</li><li>${p.diskGb} GB storage</li><li>${p.instances} services</li>
    ${(p.features||[]).map(f=>`<li>✓ ${esc(f)}</li>`).join('')}</ul>
  <a class="lt-btn ${p.featured?'lt-btn-primary':'lt-btn-secondary'}" href="/checkout?plan=${encodeURIComponent(p.id)}&interval=${interval}">Choose ${esc(p.name)}</a>
</div>`).join(''):emptyBox('No plans configured','The operator has not published any plans yet.')}</div>
<div style="text-align:center;margin-top:30px"><a class="lt-btn lt-btn-secondary" href="/configure">Build your own plan</a></div>`;
await page({ title:'Plans & pricing', active:'pricing', eyebrow:'Plans',
  heading:'Simple plans. Real resources.',
  lede:'Every plan grants a fixed allocation. Your service is provisioned automatically after checkout — no infrastructure decisions required.',
  content });
</script></body></html>
